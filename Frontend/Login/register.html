<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoops TGC - Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="page">
      <section class="left-side" aria-label="Basketball promo visual">
        <!-- Promo content removed to avoid text overlap -->
      </section>

      <section class="right-side">
        <h2>Create Account</h2>
        <p class="subtext">Join the arena and build your basketball legacy.</p>

        <div class="tabs" role="tablist" aria-label="Account tabs">
          <a class="tab" href="index.html" role="tab" aria-selected="false">Sign In</a>
          <a class="tab is-active" href="register.html" role="tab" aria-selected="true">Create Account</a>
        </div>

        <form id="registerForm" novalidate>
          <label for="fullname">Full Name</label>
          <div class="field">
            <span class="field-icon">U</span>
            <input id="fullname" name="fullname" type="text" placeholder="Michael Jordan" />
          </div>

          <label for="registerEmail">Email Address</label>
          <div class="field">
            <span class="field-icon">@</span>
            <input id="registerEmail" name="registerEmail" type="email" placeholder="player@hoopstgc.com" />
          </div>

          <label for="registerPassword">Password</label>
          <div class="field">
            <span class="field-icon">*</span>
            <input id="registerPassword" name="registerPassword" type="password" placeholder="At least 6 characters" minlength="6" />
            <button id="toggleRegisterPassword" class="ghost-icon" type="button" aria-label="Show password">Show</button>
          </div>

          <label for="confirmPassword">Confirm Password</label>
          <div class="field">
            <span class="field-icon">*</span>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat your password" minlength="6" />
            <button id="toggleConfirmPassword" class="ghost-icon" type="button" aria-label="Show confirm password">Show</button>
          </div>

          <button class="primary-btn" type="submit">Create My Account →</button>
          <p id="registerMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="divider">OR CONTINUE WITH</p>

        <div class="social-row">
          <button class="social-btn" type="button">Google</button>
          <button class="social-btn" type="button">Apple</button>
        </div>

        <p class="terms">
          By creating an account, you agree to the Terms of Service and Privacy Policy.
        </p>
      </section>
    </main>

  <script type="module" src="register.js"></script>
</body>
</html>
