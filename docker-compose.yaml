services:
  db:
    image: postgres
    ports:
      - 5434:5432  # 5433 is taken by a native PostgreSQL installation
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: TCG
      POSTGRES_INITDB_ARGS: "-c password_encryption=md5"
      POSTGRES_HOST_AUTH_METHOD: "md5"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config:/docker-entrypoint-initdb.d
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes: 
  postgres_data: