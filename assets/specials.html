    <!-- VICTOR WEMBENYEMA -->

<svg width="750" height="1050" viewBox="0 0 750 1050" xmlns="http://www.w3.org/2000/svg">

  <!-- Définition du fond texture -->
  <defs>
    <pattern id="textureBG" patternUnits="objectBoundingBox" width="1" height="1">
      <image href="textures/texture3.jpg" width="750" height="1050" preserveAspectRatio="xMidYMid slice" />
    </pattern>
  </defs>

  <!-- Fond avec texture -->
  <rect x="0" y="0" width="750" height="1050" rx="40" ry="40" fill="url(#textureBG)" />

  <!-- Bordure -->
  <rect x="20" y="20" width="710" height="1010" rx="35" ry="35"
        fill="none" stroke="#ffffff" stroke-width="6" />

  <!-- Bandeau supérieur ligue -->
  <rect x="40" y="40" width="670" height="90" rx="20" ry="20"
        fill="rgba(0,0,0,0.45)" stroke="#ffffff" stroke-width="2" />

  <text x="60" y="100" fill="#ffffff" font-family="Arial" font-size="40" font-weight="bold">
    PF / C
  </text>

   <!-- Cercle score global -->
  <circle cx="650" cy="85" r="55" fill="rgba(0,0,0,0.65)" stroke="#ffffff" stroke-width="4" />
  <text x="650" y="100" fill="#ffffff" stroke="#ffffff" stroke-width="1" font-family="Arial" font-size="42" font-weight="bold" text-anchor="middle">
    99
  </text>

  <!-- Cadre image joueur -->
  <rect x="95" y="180" width="560" height="550" rx="30" ry="30"
        fill="rgba(0,0,0,0.25)" stroke="#ffffff" stroke-width="5"
        stroke-dasharray="10 10" />
 <image href="gif/kobe.gif"
       x="95"
       y="180"
       width="560"
       height="550"
       preserveAspectRatio="xMidYMid meet" />

  <!-- Nom joueur -->
  <rect x="80" y="830" width="590" height="80" rx="20" ry="20"
        fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="2" />
  <text x="375" y="880" fill="#ffffff" font-family="Arial"
        font-size="32" font-weight="bold" text-anchor="middle">
    VICTOR WEMBENYEMA
  </text>


  <!-- Bloc stats -->
  <rect x="400" y="950" width="240" height="50" rx="20" ry="20"
        fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="2" />

  
   <rect x="130" y="950" width="240" height="50" rx="20" ry="20"
        fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="2" />

  <text x="210" y="980" fill="#f2c94c" font-family="Arial" font-size="22">
    ATT :
  </text>
  <text x="280" y="980" fill="#ffffff" font-family="Arial" font-size="22">
    80
  </text>

  <text x="470" y="980" fill="#f2c94c" font-family="Arial" font-size="22">
    DEF :
  </text>
  <text x="540" y="980" fill="#ffffff" font-family="Arial" font-size="22">
    80
  </text>


</svg>
