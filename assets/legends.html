<body>
    <!-- KOBY BRYANT -->

    <svg width="750" height="1050" viewBox="0 0 750 1050" xmlns="http://www.w3.org/2000/svg">

  <!-- Texture de fond -->
  <defs>
    <pattern id="textureBG" patternUnits="objectBoundingBox" width="1" height="1">
      <image href="textures/texture1.jpg"  width="750" height="1050" preserveAspectRatio="xMidYMid slice" />
    </pattern>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="750" height="1050" rx="40" ry="40" fill="url(#textureBG)" />

  <!-- IMAGE DU JOUEUR (EN ARRIÈRE-PLAN) -->
  <image href="png/KB.png"
       x="20"
       y="258"
       width="718"
       height="820"
       preserveAspectRatio="xMidYMid meet" />

  <!-- Bordure -->
  <rect x="20" y="20" width="710" height="1010" rx="35" ry="35"
        fill="none" stroke="#ffffff" stroke-width="6" />

  <!-- Nom du joueur en vertical -->
  <text x="60" y="555" fill="#000000" stroke="#f2c94c" stroke-width="1"font-family="Arial" font-size="70" font-weight="bold"
        transform="rotate(-90 60 525)" text-anchor="middle">
    KOBE BRYANT
  </text>

  <!-- Bloc stats ATK / DEF -->
  <rect x="40" y="850" width="200" height="180" rx="20" ry="20"
        fill="rgba(0,0,0,0.65)" stroke="#ffffff" stroke-width="2" />

  <text x="70" y="920" fill="#000000" stroke="#f2c94c" stroke-width="1" font-family="Arial" font-size="32" font-weight="bold">
    ATK
  </text>
  <text x="150" y="920" fill="#ffffff" font-family="Arial" font-size="32">
    99
  </text>

  <text x="70" y="980" fill="#000000" stroke="#f2c94c" stroke-width="1" font-family="Arial" font-size="32" font-weight="bold">
    DEF
  </text>
  <text x="150" y="980" fill="#ffffff" font-family="Arial" font-size="32">
    75
  </text>

  <!-- Bandeau ligue -->
  <rect x="40" y="40" width="500" height="90" rx="20" ry="20"
        fill="rgba(0,0,0,0.45)" stroke="#ffffff" stroke-width="2" />

  <text x="180" y="100" fill="#000000" stroke="#f2c94c" stroke-width="1" font-family="Arial" font-size="40" font-weight="bold">
    LEGENDS
  </text>

  <!-- Cercle score global -->
  <circle cx="650" cy="85" r="55" fill="rgba(0,0,0,0.65)" stroke="#ffffff" stroke-width="4" />
  <text x="650" y="100" fill="#000000" stroke="#f2c94c" stroke-width="1" font-family="Arial" font-size="42" font-weight="bold" text-anchor="middle">
    99
  </text>

  <!-- Infos équipe / poste en bas -->
  <rect x="260" y="955" width="450" height="50" rx="20" ry="20"
        fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="2" />

  <text x="350" y="990" fill="#ffffff" font-family="Arial" font-size="28">POSTE : </text>
  <text x="470" y="990" fill="#000000" stroke="#f2c94c" stroke-width="1" font-family="Arial" font-size="28"> SG/SF</text>

</svg>
